name: PineTree import & chapter regression
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'tests/pinetree-regression.js'
      - 'tests/play-mode-regression.js'
      - 'tests/living-forest-regression.js'
      - 'themes/**'
      - 'styles.css'
      - '.github/workflows/pinetree-regression.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'version.json'
      - 'tests/pinetree-regression.js'
      - 'tests/play-mode-regression.js'
      - 'tests/living-forest-regression.js'
      - 'themes/**'
      - 'styles.css'
      - '.github/workflows/pinetree-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check chapter tap / LRC imports / sync release
        run: node tests/pinetree-regression.js app.js index.html
      - name: Check playback mode transitions / sleep timer priority
        run: node tests/play-mode-regression.js

      - name: Check Living Forest and full release manifest
        run: node tests/living-forest-regression.js
